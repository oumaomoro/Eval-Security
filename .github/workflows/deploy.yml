name: Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: System health check
        run: npx tsx scripts/verify-health.ts

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: preflight
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SIGNNOW_API_KEY: ${{ secrets.SIGNNOW_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      VITE_API_URL: "https://api.costloci.com"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Unit tests
        run: npm run test:unit

      - name: Security and API tests
        run: |
          npx cross-env NODE_ENV=test tsx server/index.ts &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3200/api/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 2
          done
          npm run test:security || echo "Security tests non-fatal - continuing"
          npm run test:api || echo "API integration tests non-fatal - continuing"
          kill -9 $SERVER_PID 2>/dev/null || true

  deploy-backend:
    name: Deploy Backend (Vercel)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\",\"settings\":{\"framework\":null}}" > .vercel/project.json
          vercel --prod --yes \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --env SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --env SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --env SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --env JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --env CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            --env DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --env OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --env RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --env PAYPAL_CLIENT_ID="${{ secrets.PAYPAL_CLIENT_ID }}" \
            --env PAYPAL_SECRET="${{ secrets.PAYPAL_SECRET }}" \
            --env PAYPAL_STARTER_PLAN_ID="${{ secrets.PAYPAL_STARTER_PLAN_ID }}" \
            --env PAYPAL_PRO_PLAN_ID="${{ secrets.PAYPAL_PRO_PLAN_ID }}" \
            --env PAYPAL_ENTERPRISE_PLAN_ID="${{ secrets.PAYPAL_ENTERPRISE_PLAN_ID }}" \
            --env PAYPAL_WEBHOOK_ID="${{ secrets.PAYPAL_WEBHOOK_ID }}" \
            --env PAYSTACK_SECRET_KEY="${{ secrets.PAYSTACK_SECRET_KEY }}" \
            --env SIGNNOW_API_KEY="${{ secrets.SIGNNOW_API_KEY }}" \
            --env CSRF_SECRET="${{ secrets.CSRF_SECRET }}" \
            --env SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
            --env GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --env GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --env UPSTASH_REDIS_REST_URL="${{ secrets.UPSTASH_REDIS_REST_URL }}" \
            --env UPSTASH_REDIS_REST_TOKEN="${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" \
            --env FRONTEND_URL="https://costloci.com" \
            --env API_URL="https://api.costloci.com" \
            --env NODE_ENV="production" \
            --env ALLOWED_ORIGINS="https://costloci.com,https://www.costloci.com,https://costloci-frontend.pages.dev"

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy dist/public \
            --project-name=costloci-frontend \
            --branch=main \
            --commit-dirty=true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      TEST_BASE_URL: https://costloci.com
      API_URL: https://api.costloci.com
      TEST_LOGIN_EMAIL: ${{ secrets.TEST_LOGIN_EMAIL }}
      TEST_LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium || echo "Playwright install non-fatal - continuing"
        continue-on-error: true

      - name: Run E2E tests
        run: npx playwright test tests/e2e/auth.spec.ts --reporter=list
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify:
    name: Deployment Status
    needs: [deploy-backend, deploy-frontend, e2e-tests]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Report success
        if: needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success'
        run: |
          echo "Deployment successful"
          echo "Frontend: https://costloci.com"
          echo "Backend: https://api.costloci.com"

      - name: Report failure
        if: needs.deploy-backend.result == 'failure' || needs.deploy-frontend.result == 'failure'
        run: |
          echo "Deployment failed - check job logs above"
          exit 1
