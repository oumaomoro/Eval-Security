name: Enterprise Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SIGNNOW_API_KEY: ${{ secrets.SIGNNOW_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Check (Frontend & Backend)
        run: npm run build
      
      - name: Run Unit Tests
        run: npm run test:unit
      
      - name: Run API Tests
        run: |
          npx cross-env NODE_ENV=test tsx server/index.ts &
          npx wait-on http://localhost:3200
          npm run test:api
      
      - name: Run Security Tests
        run: npm run test:security
      
      - name: System Health Check
        run: npx tsx scripts/verify-health.ts

  deploy-production:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Backend to Vercel
        if: matrix.target == 'backend'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Deploy Frontend to Cloudflare
        if: matrix.target == 'frontend'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=costloci-frontend --branch=main

  notify:
    needs: [validate, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Success Notification
        if: needs.deploy-production.result == 'success'
        run: |
          echo "🚀 DEPLOYMENT SUCCESSFUL"
          echo "Frontend is live at https://costloci-frontend.pages.dev"
          echo "Backend API is live at https://cyberoptimize-frontend.vercel.app"
      - name: Failure Notification
        if: needs.validate.result == 'failure' || needs.deploy-production.result == 'failure'
        run: |
          echo "❌ DEPLOYMENT FAILED"
          echo "Triggering automated rollback protocol (Vercel Instant Rollback enabled)."
